<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero, which is
         how react-native-safe-area-context learns about the notch and the home
         indicator on the web. Without it the tab bar sits under the indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Train, eat and track in one place. Pick a split and get a week you can tick off, count calories against 44,000 foods including Indian ones, and watch your streak build." />

    <!-- installable -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "black" is deliberate. With "black-translucent" iOS 26 hands the web app a
         viewport 62pt shorter than the screen but still pins it to the top, which
         leaves a dead strip under the tab bar. With "black" iOS reserves the status
         bar itself, safe-area-inset-top is 0, and the page fills everything below. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Reppo" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png?v=reppo" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png?v=reppo" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png?v=reppo" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png?v=reppo" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=reppo" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png?v=reppo" />

    <!-- launch screens, one per iPhone. A device with no match just gets black. -->
    <link rel="apple-touch-startup-image" href="/splash/launch-375x667-2x.jpg?v=reppo" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-414x736-3x.jpg?v=reppo" media="(device-width:414px) and (device-height:736px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-375x812-3x.jpg?v=reppo" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-414x896-2x.jpg?v=reppo" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2) and (orientation:portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-414x896-3x.jpg?v=reppo" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-390x844-3x.jpg?v=reppo" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-393x852-3x.jpg?v=reppo" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-402x874-3x.jpg?v=reppo" media="(device-width:402px) and (device-height:874px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-428x926-3x.jpg?v=reppo" media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-430x932-3x.jpg?v=reppo" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/launch-440x956-3x.jpg?v=reppo" media="(device-width:440px) and (device-height:956px) and (-webkit-device-pixel-ratio:3) and (orientation:portrait)" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Makes the page behave like an app rather than a document: no tap flash,
         no rubber-band, no long-press callout, no text selection outside inputs. -->
    <style id="reppo-shell">
      * { -webkit-tap-highlight-color: transparent; }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        background-color: #000000;
      }
      body {
        margin: 0;
        background-color: #000000;
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      input, textarea, [contenteditable] {
        -webkit-user-select: text;
        user-select: text;
      }

      /* The boot screen. Same artwork as the iOS launch image, so the
         hand-off from the launch image to the page is invisible — black
         to black, with the same mark in the same place. Removed once
         React is up. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 9vw;
        opacity: 1;
        transition: opacity 320ms ease-out;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .glow {
        position: absolute;
        left: 50%; top: 44%;
        width: 128vw; height: 128vw;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(254,78,2,0.16) 0%, rgba(250,10,18,0.05) 42%, rgba(250,10,18,0) 68%);
      }
      #boot .mark {
        position: relative;
        display: block;
        width: 44vw; max-width: 190px; height: auto;
        opacity: 0;
        animation: bootIn 900ms cubic-bezier(0.22,1,0.36,1) 60ms forwards;
      }
      #boot .word {
        position: relative;
        margin-top: 3.4vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 9vw;
        line-height: 1;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: #FFFFFF;
        text-transform: uppercase;
        opacity: 0;
        animation: bootIn 900ms cubic-bezier(0.22,1,0.36,1) 220ms forwards;
      }
      #boot .rule {
        position: relative;
        width: 26vw; max-width: 120px; height: 3px;
        border-radius: 3px;
        margin: 2.6vh 0 2.4vh;
        background: linear-gradient(90deg, #FE4E02 0%, #FA0A12 100%);
        opacity: 0;
        animation: bootIn 900ms cubic-bezier(0.22,1,0.36,1) 360ms forwards;
      }
      #boot .meaning {
        position: relative;
        margin: 0;
        max-width: 26em;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 4.1vw;
        line-height: 1.66;
        letter-spacing: 0.02em;
        text-align: center;
        color: #9C9CA4;
        opacity: 0;
        animation: bootIn 1000ms cubic-bezier(0.22,1,0.36,1) 460ms forwards;
      }
      @keyframes bootIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @media (min-width: 620px) {
        #boot .word { font-size: 40px; }
        #boot .meaning { font-size: 16px; }
      }
</style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>

    <div id="boot">
      <div class="glow"></div>
      <img class="mark" src="/icons/mark.png?v=reppo" alt="" width="512" height="512" />
      <div class="word">Reppo</div>
      <div class="rule"></div>
      <p class="meaning">Performance, redefined.</p>
    </div>

    <script>
      (function () {
        /* ---- boot screen ---- */
        var boot = document.getElementById('boot');
        var hidden = false;
        function hideBoot() {
          if (hidden || !boot) return;
          hidden = true;
          boot.className = 'gone';
          setTimeout(function () { if (boot && boot.parentNode) boot.parentNode.removeChild(boot); }, 320);
        }
        window.__reppoReady = hideBoot;
        /* App.js calls __reppoReady once fonts and the session check are done.
           These are the belts and braces in case it never gets that far. */
        var obs = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && root.firstChild) { obs.disconnect(); setTimeout(hideBoot, 900); }
        });
        obs.observe(document.getElementById('root'), { childList: true });
        setTimeout(hideBoot, 12000);
        window.addEventListener('error', function () { setTimeout(hideBoot, 400); });

        /* ---- service worker: offline tolerance ---- */
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function (e) {
              console.warn('service worker registration failed', e);
            });
            /* A new build took over. Reload once so the page and the bundle it
               was served with stay in step. */
            var reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
              if (reloading || !navigator.serviceWorker.controller) return;
              if (!window.__reppoHadController) return;
              reloading = true;
              window.location.reload();
            });
            window.__reppoHadController = !!navigator.serviceWorker.controller;
          });
        }
      })();
    </script>
  </body>
</html>
